<head>
  <title>interview project</title>
  <script type="module" src="pogo.js"></script>
  <link rel="stylesheet" href="pogo.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=arrow_drop_down" />
</head>
<body>
  <div class="pokemon-cards-wrapper", id=pokemon>
    <div class="table-header">
      <div class="types-header">
        <div class="types-button" id="types-button">
          <span>type</span>
          <span class="material-symbols-outlined">arrow_drop_down</span>
        </div>
        <form id="types-dropdown-form"></form>
      </div>
      <div class="search bar">
        <input type="text">
      </div>
      <button>go</button>
      <div class="stat-wrapper">
        <button class="stat-button" id="er-button">er</button>
        <button class="stat-button" id="dps-button">dps</button>
      </div>
    </div>
  </div>
